syntax = "proto3";

package protobuf_transit.testing;

option csharp_namespace = "ProtobufTransit.Tests.Messages";

message SampleTextMessage {
  string text = 1;
  int32 count = 2;
  repeated string tags = 3;
}

message SampleBinaryMessage {
  bytes payload = 1;
  string content_type = 2;
}

message SampleEmptyMessage {
  string optional_text = 1;
}
